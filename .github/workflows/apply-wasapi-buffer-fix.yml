name: Apply WASAPI shared-event buffer fix

on:
  push:
    branches:
      - agent/device-selection-ui

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/device-selection-ui

      - name: Correct shared event-driven initialization
        shell: python
        run: |
          from pathlib import Path

          source_path = Path("audio_duplicator.cpp")
          source = source_path.read_text(encoding="utf-8")

          capture_old = "        100000, 0, captureFormat, nullptr);"
          render_old = "        100000, 0, renderFormat, nullptr);"

          if source.count(capture_old) != 1 or source.count(render_old) != 1:
              raise SystemExit("Expected WASAPI initialization calls were not found exactly once")

          source = source.replace(capture_old, "        0, 0, captureFormat, nullptr);")
          source = source.replace(render_old, "        0, 0, renderFormat, nullptr);")
          source_path.write_text(source, encoding="utf-8", newline="\n")

          Path(".github/workflows/apply-wasapi-buffer-fix.yml").unlink()

      - name: Commit corrected source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio_duplicator.cpp .github/workflows/apply-wasapi-buffer-fix.yml
          git commit -m "Fix WASAPI shared event buffer initialization"
          git push origin HEAD:agent/device-selection-ui
